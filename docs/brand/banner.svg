<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Pairbar — ChatGPT and Codex profiles for your Mac menu bar</title>
  <desc id="desc">Pairbar logo beside a concise description and three product attributes: Native macOS, Local-only, and Open source.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111B2A"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0E1726"/>
      <stop offset="1" stop-color="#263751"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#69DCC8" stop-opacity=".11"/>
      <stop offset="1" stop-color="#69DCC8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="520" rx="28" fill="url(#background)"/>
  <circle cx="1080" cy="118" r="320" fill="url(#glow)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g transform="translate(96 90)">
      <rect width="112" height="112" rx="29" fill="url(#icon)" stroke="#7185A0" stroke-opacity=".38" stroke-width="2"/>
      <circle cx="37" cy="35" r="12" fill="#69DCC8"/>
      <circle cx="75" cy="35" r="12" fill="#F6BC73"/>
      <rect x="20" y="57" width="36" height="36" rx="17" fill="#69DCC8"/>
      <rect x="58" y="57" width="36" height="36" rx="17" fill="#F6BC73"/>
    </g>
    <text x="236" y="171" fill="#F4F7FB" font-size="76" font-weight="700" letter-spacing="-2">Pairbar</text>
    <text x="100" y="280" fill="#F4F7FB" font-size="35" font-weight="600">ChatGPT &amp; Codex profiles, right from your Mac menu bar</text>
    <text x="102" y="329" fill="#A6B7CB" font-size="23">Keep your current account. Open the profiles you choose.</text>
    <g transform="translate(100 382)" font-size="16" font-weight="600">
      <rect width="148" height="42" rx="21" fill="#1C3040"/><text x="20" y="27" fill="#C4DED9">Native macOS</text>
      <rect x="162" width="128" height="42" rx="21" fill="#1C3040"/><text x="184" y="27" fill="#C4DED9">Local-only</text>
      <rect x="304" width="142" height="42" rx="21" fill="#1C3040"/><text x="325" y="27" fill="#C4DED9">Open source</text>
    </g>
    <path d="M100 466 H1180" stroke="#33445A" stroke-opacity=".7"/>
    <text x="100" y="494" fill="#8294AA" font-size="13" letter-spacing="1">PAIRBAR · macOS</text>
  </g>
</svg>
