name: macOS build and security invariants
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - name: Source policy audit
        run: python3 scripts/audit.py
      - name: Shell and bundle metadata validation
        run: |
          bash -n scripts/build.sh
          plutil -lint Resources/Info.plist
      - name: Unit tests
        run: swift test
      - name: Build and verify our app bundle
        run: scripts/build.sh
      - name: Verify development artifact and write build provenance
        run: |
          (cd dist && shasum -a 256 -c Pairbar.zip.sha256)
          scratch="$(mktemp -d)"
          trap 'rm -rf -- "$scratch"' EXIT
          ditto -x -k dist/Pairbar.zip "$scratch"
          codesign --verify --strict --all-architectures "$scratch/Pairbar.app"
          {
            echo "commit=${GITHUB_SHA}"
            echo "runner=${RUNNER_OS}"
            echo "signature=ad-hoc-development"
            echo "notarized=false"
            sw_vers
          } > dist/BUILD_INFO.txt
      - name: Upload development archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: Pairbar-${{ matrix.runner }}-${{ github.sha }}
          path: |
            dist/Pairbar.zip
            dist/Pairbar.zip.sha256
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14
