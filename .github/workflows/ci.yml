name: macOS build and security invariants
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - name: Source policy audit
        run: python3 scripts/audit.py
      - name: Shell and bundle metadata validation
        run: |
          bash -n scripts/build.sh
          plutil -lint Resources/Info.plist
      - name: Unit tests
        run: swift test
      - name: Build and verify our app bundle
        run: scripts/build.sh
      - name: Write build provenance
        run: |
          shasum -a 256 dist/Pairbar.zip > dist/SHA256SUMS.txt
          {
            echo "commit=${GITHUB_SHA}"
            echo "runner=${RUNNER_OS}"
            sw_vers
          } > dist/BUILD_INFO.txt
      - name: Upload personal-build archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: Pairbar-${{ matrix.runner }}-${{ github.sha }}
          path: |
            dist/Pairbar.zip
            dist/SHA256SUMS.txt
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14
