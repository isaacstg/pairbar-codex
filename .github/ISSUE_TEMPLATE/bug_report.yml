name: Bug report
description: Report a reproducible problem without sharing account data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include tokens, cookies, account emails, browser data, Keychain data, or unredacted ChatGPT diagnostics. For a security-sensitive report, use private vulnerability reporting when it is enabled.
  - type: input
    id: version
    attributes:
      label: Pairbar version and build
      placeholder: "2.0.0 (17)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 15.x"
    validations:
      required: true
  - type: textarea
    id: app
    attributes:
      label: Official provider app and version
      description: Include ChatGPT or Claude and its version/build, without account information.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Current discovery or focus
        - Managed profile launch or focus
        - Managed profile graceful close or restart
        - Multiple profiles, filtering, or selection
        - Compatibility or update gate
        - Migration, safe recovery, archive, or reset
        - Onboarding, menu, diagnostics, shortcuts, or startup
        - Accessibility or language
        - Claude Current or compatibility research
        - Build or test tooling
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …\n3. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, account identities, cookies, browser data, and Keychain data from this report.
          required: true
